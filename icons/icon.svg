<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#050508"/>
  <!-- Artwork stays inside the central maskable safe zone (radius ~205) -->
  <g fill="none" stroke="#ffffff" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)">
    <!-- Ship, pointing up and to the right -->
    <g transform="translate(236 278) rotate(-45)">
      <path d="M70 0 L-55 -44 L-32 0 L-55 44 Z"/>
      <path d="M-40 -16 L-100 0 L-40 16" stroke="#f97316"/>
    </g>
    <!-- Large asteroid -->
    <path d="M296 156 L330 122 L362 140 L392 132 L404 172 L384 194 L398 224 L352 232 L322 212 L294 196 Z"/>
    <!-- Small asteroid -->
    <path d="M146 168 L170 154 L184 170 L196 176 L186 200 L160 204 L150 190 Z"/>
  </g>
</svg>
